<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic tak toe</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main>  
            <div class="StartModal">
                <h1>Let's play Tic tac Toe Game</h1>
                <button class="StartBtn"> Start </button>
            </div>
            <h1>Let's play Tic tac Toe Game</h1>
            <section>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </section>
            <div class="players">
                <h2>Player 1 : <Span>X</Span> </h2>
                <h2>Player 2 : <Span>O</Span> </h2>
            </div>
            <div class="turn">
                <h2 class="current-turn">Player 1 Turn </h2>
            </div>
            <BUtton class="RestartBtn">Restart</BUtton>

    </main>
    <Script src="Script.js" ></Script>
</body>
</html>
